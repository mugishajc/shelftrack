spring:
  application:
    name: library-management
  datasource:
    url: jdbc:h2:mem:library;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the mappings match it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  error:
    include-stacktrace: never

library:
  time-zone: Africa/Kigali
  loans:
    loan-days: 14
    max-active-loans: 3
    max-renewals: 1
    grace-period-days: 0
    daily-fine: 100.00
    max-fine: 5000.00
