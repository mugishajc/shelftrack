spring:
  application:
    name: library-management
  datasource:
    url: jdbc:h2:mem:library;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the mappings match it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  error:
    include-stacktrace: never
